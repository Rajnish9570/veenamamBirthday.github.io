
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7d1028">
<title>Navadurga | Nine Forms of Maa Durga</title>
<style>
:root {
  --wine:#74142c; --red:#a51d35; --gold:#f5c86a;
  --cream:#fff8eb; --ink:#351b20; --muted:#80676a;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Georgia,"Noto Serif Devanagari",serif;
  background:var(--cream);color:var(--ink);
}
header{
  text-align:center;padding:42px 16px 32px;color:white;
  background:radial-gradient(circle at top,#b7434c,var(--wine) 68%);
  border-bottom:5px solid var(--gold);
}
.ornament{font-size:27px;color:var(--gold)}
header h1{font-size:clamp(30px,6vw,52px);margin:12px 0}
header p{max-width:700px;margin:10px auto;line-height:1.8}
.controls{
  display:flex;justify-content:center;align-items:center;
  gap:12px;flex-wrap:wrap;padding:20px 12px;
  position:sticky;top:0;z-index:5;background:#fff8ebed;
  border-bottom:1px solid #ead8c5;backdrop-filter:blur(10px);
}
select,input,button{
  font:inherit;border-radius:10px;padding:11px 14px;
  border:1px solid #d9b7a4;background:white;color:var(--ink);
}
button{cursor:pointer}
button:hover{filter:brightness(.96)}
select:focus,input:focus,button:focus-visible{
  outline:2px solid var(--gold);outline-offset:3px;
}
#search{width:min(300px,90vw)}
main{max-width:1150px;margin:auto;padding:22px 16px 50px}
.section-title{text-align:center;color:var(--wine);margin:12px 0 24px}
.grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;
}
.card{
  background:white;border:1px solid #eddcc7;border-radius:17px;
  padding:20px 15px;text-align:center;cursor:pointer;
  box-shadow:0 5px 18px #5613260b;transition:.2s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 25px #56132618}
.card .symbol{font-size:39px}
.card .day{color:var(--red);font-size:13px;letter-spacing:1px}
.card h3{color:var(--wine);margin:9px 0 5px;font-size:21px}
.card .hindi{font-size:19px}
.card p{color:var(--muted);line-height:1.65;font-size:14px}
.read{color:var(--red);font-weight:bold}
#details{
  display:none;background:white;border:1px solid #e8c99c;
  border-radius:20px;padding:clamp(18px,4vw,38px);
  margin-top:32px;box-shadow:0 10px 35px #56132610;
}
.detail-head{text-align:center;border-bottom:1px solid #ead9c5;padding-bottom:20px}
.detail-head .symbol{font-size:58px}
.detail-head h2{font-size:clamp(25px,5vw,38px);color:var(--wine);margin:8px 0}
.detail-head p{line-height:1.8}
.badge{display:inline-block;background:#fff1d3;color:#713a16;padding:7px 12px;border-radius:30px;margin:4px;font-size:14px}
.note-section{margin-top:24px;line-height:1.9}
.note-section h3{color:var(--red);border-bottom:1px solid #f0e2d5;padding-bottom:7px}
.note-section p{white-space:pre-line}
.mantra{
  background:#fff5e2;border-left:4px solid var(--gold);
  padding:16px;border-radius:8px;line-height:1.9;
}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.primary{background:var(--wine);color:white;border-color:var(--wine)}
.secondary{background:#fff3dc}
.empty{text-align:center;padding:30px;grid-column:1/-1}
footer{
  text-align:center;background:#4e1021;color:#fff0d6;
  padding:27px 15px;line-height:1.8
}
footer span{color:var(--gold)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px 9px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.controls{position:static}.card{padding:19px}}
@media print{
  header,.controls,.actions,footer,.grid,.section-title{display:none!important}
  #details{display:block!important;border:0;box-shadow:none}
  body{background:white}
}
</style>
</head>
<body>

<header>
  <div class="ornament">❋ ॐ ❋</div>

  <div class="ornament">✦ जय माता दी ✦</div>
</header>

<div class="controls">
  <label for="language" id="languageLabel">Choose Language</label>
  <select id="language" aria-label="Choose language">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
  </select>
  <input id="search" type="search" placeholder="Search an avatar..." aria-label="Search avatars">
  <button class="secondary" id="allBtn">All 9 Avatars</button>
</div>

<main>
  <h2 class="section-title" id="listTitle">Explore the Nine Forms</h2>
  <div class="grid" id="grid"></div>

  <article id="details">
    <div class="actions">
      <button class="secondary" id="backBtn">← Back to all avatars</button>
    </div>
    <div id="detailContent"></div>
    <div class="actions">
      <button class="primary" id="prevBtn">← Previous</button>
      <button class="secondary" id="printBtn">Print / Save PDF</button>
      <button class="primary" id="nextBtn">Next →</button>
    </div>
  </article>
</main>

<footer>
  <div style="font-size:25px;color:#f5c86a">॥ जय माता दी ॥</div>
  <p id="footerText">May Maa Durga bless every home with courage, wisdom, peace and prosperity.</p>
  <span>ॐ दुं दुर्गायै नमः</span>
</footer>
